<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joe Marrama</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Outfit:wght@300;400;700&display=swap');
    
    :root {
      --bg: #0a0a0f;
      --cyan: #00f5ff;
      --magenta: #ff00ff;
      --green: #00ff88;
      --yellow: #ffee00;
      --purple: #8844ff;
      --text: #e0e0e0;
      --text-dim: #666680;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    
    #microscope {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    .ui-layer {
      position: fixed;
      z-index: 10;
      pointer-events: none;
    }
    
    .ui-layer > * {
      pointer-events: auto;
    }
    
    /* Header */
    .header {
      top: 0;
      left: 0;
      right: 0;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(10,10,15,0.9) 0%, transparent 100%);
    }
    
    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--cyan);
      text-transform: uppercase;
      opacity: 0.8;
    }
    
    .zoom-indicator {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(0,245,255,0.2);
    }
    
    /* Sidebar */
    .sidebar {
      top: 50%;
      right: 32px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .nav-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    
    .nav-btn:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(0,245,255,0.3);
      transform: scale(1.1);
    }
    
    .nav-btn svg {
      width: 20px;
      height: 20px;
    }
    
    /* Bottom panel */
    .bottom-panel {
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 32px;
      background: linear-gradient(to top, rgba(10,10,15,0.95) 0%, transparent 100%);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    
    .title-section h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--cyan), var(--magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 8px;
    }
    
    .title-section .subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }
    
    .sample-counter {
      text-align: right;
    }
    
    .sample-counter .label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    
    .sample-counter .count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      color: var(--green);
    }
    
    .sample-counter .count span {
      color: var(--text-dim);
      font-size: 14px;
    }
    
    /* Floating info panel */
    .info-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10,10,15,0.95);
      border: 1px solid rgba(0,245,255,0.3);
      border-radius: 16px;
      padding: 32px;
      max-width: 400px;
      z-index: 100;
      backdrop-filter: blur(20px);
      display: none;
    }
    
    .info-panel.visible {
      display: block;
      animation: popIn 0.3s ease;
    }
    
    @keyframes popIn {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }
    
    .info-panel h3 {
      font-size: 18px;
      margin-bottom: 12px;
      color: var(--cyan);
    }
    
    .info-panel p {
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.6;
    }
    
    .info-panel .close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 20px;
    }
    
    /* Instructions */
    .instructions {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      opacity: 0.6;
      z-index: 5;
      transition: opacity 0.5s;
    }
    
    .instructions.hidden {
      opacity: 0;
    }
    
    /* Channel legend */
    .channel-legend {
      position: fixed;
      bottom: 24px;
      left: 32px;
      display: flex;
      gap: 16px;
      z-index: 10;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
    }
    
    .channel-legend .channel {
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.7;
    }
    
    .channel-legend .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    
    /* Collected samples drawer */
    .samples-drawer {
      position: fixed;
      bottom: 100px;
      left: 32px;
      display: flex;
      gap: 8px;
      z-index: 5;
    }
    
    .sample-orb {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid currentColor;
      opacity: 0.3;
      transition: all 0.3s ease;
    }
    
    .sample-orb.collected {
      opacity: 1;
      box-shadow: 0 0 20px currentColor;
    }
    
    /* DNA helix decoration */
    .dna-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.1;
    }
  </style>
</head>
<body>
  <canvas id="microscope"></canvas>
  
  <div class="ui-layer header">
    <div class="logo">◈ Microscope</div>
    <div class="zoom-indicator">zoom: <span id="zoomLevel">0.2</span>x</div>
  </div>
  
  <div class="ui-layer sidebar">
    <button class="nav-btn" id="zoomIn" title="Zoom In">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/>
      </svg>
    </button>
    <button class="nav-btn" id="zoomOut" title="Zoom Out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6"/>
      </svg>
    </button>
    <button class="nav-btn" id="resetView" title="Reset View">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>
  </div>
  
  <div class="ui-layer bottom-panel">
    <div class="title-section">
      <h1>Joe Marrama</h1>
    </div>
    <div class="sample-counter">
      <div class="label">Samples Discovered</div>
      <div class="count"><span id="collectedCount">0</span> <span>/ 6</span></div>
    </div>
  </div>
  
  <div class="samples-drawer" id="samplesDrawer"></div>
  
  <div class="instructions" id="instructions">
    scroll to zoom · drag to pan · click cells to discover samples
  </div>
  
  <div class="channel-legend">
    <div class="channel"><span class="dot" style="background:#2E86AB"></span>DNA</div>
    <div class="channel"><span class="dot" style="background:#28A745"></span>Actin</div>
    <div class="channel"><span class="dot" style="background:#DC3545"></span>Mito</div>
    <div class="channel"><span class="dot" style="background:#FFC107"></span>ER</div>
  </div>
  
  <div class="info-panel" id="infoPanel">
    <button class="close" id="closePanel">×</button>
    <h3 id="infoTitle">Sample</h3>
    <p id="infoText">Description</p>
  </div>

  <script>
    const canvas = document.getElementById('microscope');
    const ctx = canvas.getContext('2d');
    
    // State
    let width, height;
    let zoom = 0.15;
    let panX = 0, panY = 0;
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let panStart = { x: 0, y: 0 };
    let time = 0;
    let hasInteracted = false;
    let collectedSamples = new Set();
    
    // CellPaint-style channel colors (simulating CP channels)
    const CHANNELS = {
      dna: { color: '#2E86AB', name: 'DNA (Hoechst)' },      // Blue - nucleus
      actin: { color: '#28A745', name: 'Actin (Phalloidin)' }, // Green - cytoskeleton
      mito: { color: '#DC3545', name: 'Mitochondria' },       // Red
      er: { color: '#FFC107', name: 'ER (Concanavalin)' }     // Yellow
    };
    
    // Sample data - A549 lung epithelial cells with CellPaint channels
    const samples = [
      {
        id: 'a549-1',
        name: 'A549 Cells',
        channels: ['dna', 'actin', 'mito', 'er'],
        description: 'Human alveolar type II epithelial cells from lung adenocarcinoma. The workhorse of respiratory research and drug discovery.',
        x: 0.3,
        y: 0.35,
        type: 'a549'
      },
      {
        id: 'a549-2',
        name: 'A549 Cells',
        channels: ['dna', 'actin', 'mito', 'er'],
        description: 'Adherent epithelial cells with characteristic cobblestone morphology. Frequently used in COVID-19 and lung cancer studies.',
        x: 0.65,
        y: 0.4,
        type: 'a549'
      },
      {
        id: 'a549-3',
        name: 'A549 Cells',
        channels: ['dna', 'actin', 'mito', 'er'],
        description: 'These cells have large nuclei with prominent nucleoli - visible in the DNA channel. The actin network gives the cell its shape.',
        x: 0.45,
        y: 0.6,
        type: 'a549'
      },
      {
        id: 'a549-4',
        name: 'A549 Cells',
        channels: ['dna', 'actin', 'mito', 'er'],
        description: 'Mitochondria clustered around the nucleus - typical perinuclear distribution. ER network spans throughout the cytoplasm.',
        x: 0.75,
        y: 0.7,
        type: 'a549'
      },
      {
        id: 'a549-5',
        name: 'A549 Cells',
        channels: ['dna', 'actin', 'mito', 'er'],
        description: 'Cell in mitosis - note the condensed chromosomes (bright blue DNA signal) and disassembled actin network.',
        x: 0.2,
        y: 0.65,
        type: 'a549'
      },
      {
        id: 'a549-6',
        name: 'A549 Cells',
        channels: ['dna', 'actin', 'mito', 'er'],
        description: 'Confluent monolayer region - cells showing contact inhibition. The bright actin edges show where cells touch.',
        x: 0.55,
        y: 0.2,
        type: 'a549'
      }
    ];
    
    // Initialize drawer
    const drawer = document.getElementById('samplesDrawer');
    samples.forEach((s, i) => {
      const orb = document.createElement('div');
      orb.className = 'sample-orb';
      orb.style.color = CHANNELS[s.channels[0]].color;
      orb.id = `orb-${s.id}`;
      orb.title = s.name;
      drawer.appendChild(orb);
    });
    
    // Resize
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    
    // A549 Cell class - realistic cell painting
    class Cell {
      constructor(x, y, size, channels, type) {
        this.x = x;
        this.y = y;
        this.baseX = x;
        this.baseY = y;
        this.size = size;
        this.baseSize = size;
        this.channels = channels;
        this.type = type;
        this.phase = Math.random() * Math.PI * 2;
        this.drift = Math.random() * 0.5 - 0.25;
        this.visited = false;
        
        // Generate realistic cell membrane shape (irregular ellipse)
        this.membranePoints = [];
        const numPoints = 32;
        for (let i = 0; i < numPoints; i++) {
          const angle = (i / numPoints) * Math.PI * 2;
          const variance = 0.85 + Math.random() * 0.3;
          this.membranePoints.push({
            angle,
            radius: variance,
            speed: 0.3 + Math.random() * 0.4
          });
        }
        
        // Generate nucleus position (slightly off-center)
        this.nucOffsetX = (Math.random() - 0.5) * 0.15;
        this.nucOffsetY = (Math.random() - 0.5) * 0.15;
        
        // Generate more mitochondrial positions for visibility
        this.mitochondria = [];
        for (let i = 0; i < 15; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 0.25 + Math.random() * 0.5;
          this.mitochondria.push({
            angle,
            dist,
            size: 0.7 + Math.random() * 0.5,
            phase: Math.random() * Math.PI * 2
          });
        }
        
        // ER network points
        this.erPoints = [];
        for (let i = 0; i < 20; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 0.2 + Math.random() * 0.5;
          this.erPoints.push({
            angle,
            dist,
            size: 0.3 + Math.random() * 0.3
          });
        }
      }
      
      update(t) {
        this.x = this.baseX + Math.sin(t * 0.5 + this.phase) * 20;
        this.y = this.baseY + Math.cos(t * 0.3 + this.phase) * 15;
        
        // Gentle pulsing
        this.size = this.baseSize * (1 + Math.sin(t * 2 + this.phase) * 0.05);
      }
      
      draw(t) {
        const sx = (this.x - panX) * zoom + width / 2;
        const sy = (this.y - panY) * zoom + height / 2;
        const ss = this.size * zoom;
        
        if (sx < -ss * 2 || sx > width + ss * 2 || sy < -ss * 2 || sy > height + ss * 2) return;
        
        ctx.save();
        
        // Draw ER (endoplasmic reticulum) - bottom layer
        ctx.globalAlpha = 0.5;
        this.erPoints.forEach(er => {
          const erAngle = er.angle + t * 0.1 * er.dist;
          const erDist = er.dist * ss;
          const erX = sx + Math.cos(erAngle) * erDist;
          const erY = sy + Math.sin(erAngle) * erDist * 0.8;
          const erSize = er.size * ss * 0.3;
          
          ctx.fillStyle = CHANNELS.er.color;
          ctx.shadowColor = CHANNELS.er.color;
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(erX, erY, erSize, 0, Math.PI * 2);
          ctx.fill();
        });
        
        // Draw mitochondria - make them prominent!
        ctx.globalAlpha = 0.9;
        this.mitochondria.forEach(mito => {
          const mitoAngle = mito.angle + t * 0.15 * mito.speed;
          const mitoDist = mito.dist * ss;
          const mitoX = sx + Math.cos(mitoAngle) * mitoDist;
          const mitoY = sy + Math.sin(mitoAngle) * mitoDist * 0.8;
          const mitoSize = mito.size * ss * 0.4;
          
          ctx.fillStyle = CHANNELS.mito.color;
          ctx.shadowColor = CHANNELS.mito.color;
          ctx.shadowBlur = 20;
          ctx.beginPath();
          ctx.ellipse(mitoX, mitoY, mitoSize * 2, mitoSize * 0.7, mitoAngle, 0, Math.PI * 2);
          ctx.fill();
        });
        
        // Draw cell membrane/actin - middle layer
        ctx.globalAlpha = 0.8;
        ctx.strokeStyle = CHANNELS.actin.color;
        ctx.fillStyle = CHANNELS.actin.color + '20';
        ctx.shadowColor = CHANNELS.actin.color;
        ctx.shadowBlur = 15;
        ctx.lineWidth = 2 * zoom;
        
        ctx.beginPath();
        this.membranePoints.forEach((pt, i) => {
          const membraneT = t * pt.speed + this.phase;
          const wobble = Math.sin(membraneT + pt.angle * 3) * 0.1;
          const r = pt.radius + wobble;
          const px = sx + Math.cos(pt.angle) * ss * r;
          const py = sy + Math.sin(pt.angle) * ss * r * 0.85;
          
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        // Draw nucleus - DNA channel (top layer)
        const nucX = sx + this.nucOffsetX * ss;
        const nucY = sy + this.nucOffsetY * ss;
        const nucSize = ss * 0.35;
        
        // Nucleus glow
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = CHANNELS.dna.color;
        ctx.shadowColor = CHANNELS.dna.color;
        ctx.shadowBlur = 25;
        ctx.beginPath();
        ctx.ellipse(nucX, nucY, nucSize, nucSize * 0.85, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Nucleolus (brighter spot)
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = '#FFFFFF';
        ctx.shadowColor = CHANNELS.dna.color;
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(nucX - nucSize * 0.2, nucY - nucSize * 0.2, nucSize * 0.15, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
      }
      
      contains(px, py) {
        const sx = (this.x - panX) * zoom + width / 2;
        const sy = (this.y - panY) * zoom + height / 2;
        const dist = Math.hypot(px - sx, py - sy);
        return dist < this.size * zoom * 1.5;
      }
    }
    
    // Background particles
    class Particle {
      constructor() {
        this.reset();
      }
      
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = (Math.random() - 0.5) * 0.3;
        this.color = ['#2E86AB', '#28A745', '#DC3545', '#FFC107'][Math.floor(Math.random() * 4)];
        this.alpha = Math.random() * 0.3 + 0.1;
      }
      
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        
        if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
          this.reset();
        }
      }
      
      draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    // Create cells from samples
    const cells = samples.map(s => {
      return new Cell(
        (s.x - 0.5) * Math.min(width, height) * 0.8,
        (s.y - 0.5) * Math.min(width, height) * 0.8,
        50 + Math.random() * 30,
        s.channels,
        s.type
      );
    });
    
    // Background particles
    const particles = [];
    for (let i = 0; i < 100; i++) {
      particles.push(new Particle());
    }
    
    // Grid lines (microscope reticle)
    function drawReticle() {
      ctx.strokeStyle = 'rgba(0,245,255,0.1)';
      ctx.lineWidth = 1;
      
      const cx = width / 2;
      const cy = height / 2;
      const gridSize = 100 * zoom;
      
      // Vertical lines
      for (let x = cx % gridSize; x < width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      
      // Horizontal lines
      for (let y = cy % gridSize; y < height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
      
      // Crosshair
      ctx.strokeStyle = 'rgba(0,245,255,0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - 50, cy);
      ctx.lineTo(cx + 50, cy);
      ctx.moveTo(cx, cy - 50);
      ctx.lineTo(cx, cy + 50);
      ctx.stroke();
      
      // Circle
      ctx.beginPath();
      ctx.arc(cx, cy, 100 * zoom, 0, Math.PI * 2);
      ctx.stroke();
    }
    
    // Scale bar - 10μm
    function drawScaleBar() {
      // Assuming cell size ~20μm, scale accordingly
      const pixelsPerMicron = 3; // At zoom=1, ~3 pixels per micron
      const scaleMicrons = 10;
      const scalePixels = scaleMicrons * pixelsPerMicron * zoom;
      
      const barX = 50;
      const barY = height - 50;
      
      ctx.save();
      ctx.strokeStyle = '#ffffff';
      ctx.fillStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.font = '12px JetBrains Mono, monospace';
      ctx.textAlign = 'left';
      
      // Draw bar
      ctx.beginPath();
      ctx.moveTo(barX, barY);
      ctx.lineTo(barX + scalePixels, barY);
      ctx.stroke();
      
      // Draw endpoints
      ctx.beginPath();
      ctx.moveTo(barX, barY - 5);
      ctx.lineTo(barX, barY + 5);
      ctx.moveTo(barX + scalePixels, barY - 5);
      ctx.lineTo(barX + scalePixels, barY + 5);
      ctx.stroke();
      
      // Label
      ctx.fillText(`${scaleMicrons}μm`, barX, barY - 10);
      ctx.restore();
    }
    
    // Animation loop
    function animate() {
      time += 0.016;
      
      // Clear
      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, width, height);
      
      // Draw particles
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      
      // Draw reticle
      drawReticle();
      
      // Draw scale bar
      drawScaleBar();
      
      // Draw cells
      cells.forEach(cell => {
        cell.update(time);
        cell.draw(time);
      });
      
      // Vignette effect
      const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.max(width, height) * 0.7);
      gradient.addColorStop(0, 'transparent');
      gradient.addColorStop(1, 'rgba(0,0,0,0.7)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
      
      requestAnimationFrame(animate);
    }
    animate();
    
    // Interactions
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
      zoom = Math.max(0.1, Math.min(60, zoom * zoomFactor));
      document.getElementById('zoomLevel').textContent = zoom.toFixed(1);
      
      if (!hasInteracted) {
        hasInteracted = true;
        document.getElementById('instructions').classList.add('hidden');
      }
    });
    
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStart = { x: e.clientX, y: e.clientY };
      panStart = { x: panX, y: panY };
    });
    
    canvas.addEventListener('mousemove', (e) => {
      if (isDragging) {
        panX = panStart.x - (e.clientX - dragStart.x) / zoom;
        panY = panStart.y - (e.clientY - dragStart.y) / zoom;
        
        if (!hasInteracted) {
          hasInteracted = true;
          document.getElementById('instructions').classList.add('hidden');
        }
      }
    });
    
    canvas.addEventListener('mouseup', () => {
      isDragging = false;
    });
    
    canvas.addEventListener('click', (e) => {
      if (isDragging) return;
      
      cells.forEach(cell => {
        if (cell.contains(e.clientX, e.clientY)) {
          showInfo(cell);
        }
      });
    });
    
    // Touch support
    let touchStart = null;
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        panStart = { x: panX, y: panY };
      }
    });
    
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && touchStart) {
        panX = panStart.x - (e.touches[0].clientX - touchStart.x) / zoom;
        panY = panStart.y - (e.touches[0].clientY - touchStart.y) / zoom;
        
        if (!hasInteracted) {
          hasInteracted = true;
          document.getElementById('instructions').classList.add('hidden');
        }
      } else if (e.touches.length === 2) {
        // Pinch zoom
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (touchStart.dist) {
          const zoomFactor = dist / touchStart.dist;
          zoom = Math.max(0.1, Math.min(60, zoom * zoomFactor));
          document.getElementById('zoomLevel').textContent = zoom.toFixed(1);
        }
        touchStart.dist = dist;
      }
    });
    
    canvas.addEventListener('touchend', () => {
      touchStart = null;
    });
    
    // UI Buttons
    document.getElementById('zoomIn').addEventListener('click', () => {
      zoom = Math.min(60, zoom * 1.3);
      document.getElementById('zoomLevel').textContent = zoom.toFixed(1);
    });
    
    document.getElementById('zoomOut').addEventListener('click', () => {
      zoom = Math.max(0.1, zoom * 0.7);
      document.getElementById('zoomLevel').textContent = zoom.toFixed(1);
    });
    
    document.getElementById('resetView').addEventListener('click', () => {
      zoom = 0.15;
      panX = 0;
      panY = 0;
      document.getElementById('zoomLevel').textContent = '0.2';
    });
    
    // Info panel
    function showInfo(cell) {
      const sample = samples.find(s => s.id === cell.type);
      if (!sample) return;
      
      document.getElementById('infoTitle').textContent = sample.name;
      document.getElementById('infoTitle').style.color = sample.color;
      document.getElementById('infoText').textContent = sample.description;
      document.getElementById('infoPanel').classList.add('visible');
      
      // Collect sample
      if (!collectedSamples.has(sample.id)) {
        collectedSamples.add(sample.id);
        document.getElementById(`orb-${sample.id}`).classList.add('collected');
        document.getElementById('collectedCount').textContent = collectedSamples.size;
      }
    }
    
    document.getElementById('closePanel').addEventListener('click', () => {
      document.getElementById('infoPanel').classList.remove('visible');
    });
    
    document.getElementById('infoPanel').addEventListener('click', (e) => {
      if (e.target === document.getElementById('infoPanel')) {
        document.getElementById('infoPanel').classList.remove('visible');
      }
    });
    
    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.getElementById('infoPanel').classList.remove('visible');
      }
    });
  </script>
</body>
</html>
