<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joe Marrama - Microscope</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    #microscope {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
  </style>
</head>
<body>
  <canvas id="microscope"></canvas>
  
  <div class="ui-layer header">
    <a href="index.html" class="logo">◈ Microscope</a>
    <a href="unicorn.html" class="nav-link">🦄 Unicorn Race</a>
    <div class="zoom-indicator">zoom: <span id="zoomLevel">0.5</span>x</div>
  </div>
  
  <div class="ui-layer sidebar">
    <button class="nav-btn" id="zoomIn" title="Zoom In">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/>
      </svg>
    </button>
    <button class="nav-btn" id="zoomOut" title="Zoom Out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6"/>
      </svg>
    </button>
    <button class="nav-btn" id="resetView" title="Reset View">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>
  </div>
  
  <div class="ui-layer bottom-panel">
    <div class="title-section">
      <h1>Joe Marrama</h1>
    </div>
    <div class="sample-counter">
      <div class="label">Samples Discovered</div>
      <div class="count"><span id="collectedCount">0</span> <span>/ 6</span></div>
    </div>
  </div>
  
  <div class="samples-drawer" id="samplesDrawer"></div>
  
  <div class="instructions" id="instructions">
    scroll to zoom · drag to pan · click cells to discover samples
  </div>
  
  <div class="channel-legend">
    <div class="channel"><span class="dot" style="background:#2E86AB"></span>DAPI</div>
    <div class="channel"><span class="dot" style="background:#28A745"></span>Actin</div>
    <div class="channel"><span class="dot" style="background:#DC3545"></span>Mito</div>
    <div class="channel"><span class="dot" style="background:#FFC107"></span>ER</div>
  </div>
  
  <div class="info-panel" id="infoPanel">
    <button class="close" id="closePanel">×</button>
    <h3 id="infoTitle">Sample</h3>
    <p id="infoText">Description</p>
  </div>

  <script>
    // Microscope only - no game code
    const canvas = document.getElementById('microscope');
    const ctx = canvas.getContext('2d');
    
    // State
    let width, height;
    let zoom = 0.5;
    let panX = 0, panY = 0;
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let panStart = { x: 0, y: 0 };
    let time = 0;
    let hasInteracted = false;
    let collectedSamples = new Set();
    let animationId = null;
    
    // CellPaint-style channel colors
    const CHANNELS = {
      dapi: { color: '#3d0066', name: 'DAPI (Nucleus)' },
      actin: { color: '#ff69b4', name: 'Actin (Phalloidin)' },
      mito: { color: '#ff0000', name: 'Mitochondria' },
      er: { color: '#FFA500', name: 'ER (Concanavalin)' }
    };
    
    // Sample data
    const samples = [
      { id: 'a549-1', name: 'A549 Cells', channels: ['dapi', 'actin', 'mito', 'er'],
        description: 'Human alveolar type II epithelial cells from lung adenocarcinoma.',
        x: 0.15, y: 0.2, type: 'a549' },
      { id: 'a549-2', name: 'A549 Cells', channels: ['dapi', 'actin', 'mito', 'er'],
        description: 'Adherent epithelial cells with characteristic cobblestone morphology.',
        x: 0.8, y: 0.25, type: 'a549' },
      { id: 'a549-3', name: 'A549 Cells', channels: ['dapi', 'actin', 'mito', 'er'],
        description: 'Large nuclei with prominent nucleoli - visible in the DAPI channel.',
        x: 0.35, y: 0.7, type: 'a549' },
      { id: 'a549-4', name: 'A549 Cells', channels: ['dapi', 'actin', 'mito', 'er'],
        description: 'Mitochondria clustered around the nucleus - typical perinuclear distribution.',
        x: 0.85, y: 0.75, type: 'a549' },
      { id: 'a549-5', name: 'A549 Cells', channels: ['dapi', 'actin', 'mito', 'er'],
        description: 'Cell in mitosis - condensed chromosomes and disassembled actin network.',
        x: 0.1, y: 0.8, type: 'a549' },
      { id: 'a549-6', name: 'A549 Cells', channels: ['dapi', 'actin', 'mito', 'er'],
        description: 'Confluent monolayer region - cells showing contact inhibition.',
        x: 0.6, y: 0.15, type: 'a549' }
    ];
    
    // Initialize drawer
    const drawer = document.getElementById('samplesDrawer');
    samples.forEach((s, i) => {
      const orb = document.createElement('div');
      orb.className = 'sample-orb';
      orb.style.color = CHANNELS[s.channels[0]].color;
      orb.id = `orb-${s.id}`;
      orb.title = s.name;
      drawer.appendChild(orb);
    });
    
    // Resize
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    
    // Cell class
    class Cell {
      constructor(x, y, size, channels, type, sampleId) {
        this.x = x;
        this.baseX = x;
        this.y = y;
        this.baseY = y;
        this.size = size;
        this.baseSize = size;
        this.channels = channels;
        this.type = type;
        this.sampleId = sampleId;
        this.phase = Math.random() * Math.PI * 2;
        this.visited = false;
        
        // Membrane shape
        this.membranePoints = [];
        const numPoints = 48;
        for (let i = 0; i < numPoints; i++) {
          const angle = (i / numPoints) * Math.PI * 2;
          const baseRadius = 0.85 + Math.sin(angle * 3 + this.phase) * 0.15;
          const variance = (Math.random() - 0.5) * 0.2;
          this.membranePoints.push({ angle, radius: baseRadius + variance });
        }
        
        this.nucOffsetX = (Math.random() - 0.5) * 0.15;
        this.nucOffsetY = (Math.random() - 0.5) * 0.15;
        
        // DAPI dots
        this.dapiDots = [];
        for (let i = 0; i < 20; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * 0.75;
          this.dapiDots.push({ angle, dist, size: 0.04 + Math.random() * 0.06, brightness: 0.4 + Math.random() * 0.6 });
        }
        
        // Mitochondria
        this.mitochondria = [];
        for (let i = 0; i < 18; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 0.45 + Math.random() * 0.3;
          this.mitochondria.push({ angle, dist, size: 0.04 + Math.random() * 0.03 });
        }
        
        // ER network
        this.erPoints = [];
        for (let i = 0; i < 15; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 0.42 + Math.random() * 0.2;
          this.erPoints.push({ angle, dist, size: 0.03 + Math.random() * 0.02 });
        }
      }
      
      update(t) { /* static */ }
      
      draw(t) {
        const sx = (this.x - panX) * zoom + width / 2;
        const sy = (this.y - panY) * zoom + height / 2;
        const ss = this.size * zoom;
        
        if (sx < -ss * 2 || sx > width + ss * 2 || sy < -ss * 2 || sy > height + ss * 2) return;
        
        ctx.save();
        
        // Cell boundary
        const cellPath = new Path2D();
        this.membranePoints.forEach((pt, i) => {
          const px = sx + Math.cos(pt.angle) * ss * pt.radius;
          const py = sy + Math.sin(pt.angle) * ss * pt.radius * 0.9;
          if (i === 0) cellPath.moveTo(px, py);
          else cellPath.lineTo(px, py);
        });
        cellPath.closePath();
        
        ctx.save();
        ctx.clip(cellPath);
        
        // ER
        ctx.globalAlpha = 0.5;
        this.erPoints.forEach(er => {
          const erDist = er.dist * ss;
          const erX = sx + Math.cos(er.angle) * erDist;
          const erY = sy + Math.sin(er.angle) * erDist * 0.9;
          ctx.fillStyle = CHANNELS.er.color;
          ctx.shadowColor = CHANNELS.er.color;
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(erX, erY, er.size * ss, 0, Math.PI * 2);
          ctx.fill();
        });
        
        // Mitochondria
        ctx.globalAlpha = 0.9;
        this.mitochondria.forEach(mito => {
          const mitoDist = mito.dist * ss;
          const mitoX = sx + Math.cos(mito.angle) * mitoDist;
          const mitoY = sy + Math.sin(mito.angle) * mitoDist * 0.9;
          ctx.fillStyle = CHANNELS.mito.color;
          ctx.shadowColor = CHANNELS.mito.color;
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(mitoX, mitoY, mito.size * ss, 0, Math.PI * 2);
          ctx.fill();
        });
        
        ctx.restore();
        
        // Cell membrane
        ctx.globalAlpha = 0.85;
        ctx.strokeStyle = CHANNELS.actin.color;
        ctx.fillStyle = CHANNELS.actin.color + '20';
        ctx.shadowColor = CHANNELS.actin.color;
        ctx.shadowBlur = 15;
        ctx.lineWidth = 2 * zoom;
        
        ctx.beginPath();
        this.membranePoints.forEach((pt, i) => {
          const px = sx + Math.cos(pt.angle) * ss * pt.radius;
          const py = sy + Math.sin(pt.angle) * ss * pt.radius * 0.9;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        // Nucleus
        const nucX = sx + this.nucOffsetX * ss;
        const nucY = sy + this.nucOffsetY * ss;
        const nucSize = ss * 0.35;
        
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = CHANNELS.dapi.color;
        ctx.shadowColor = CHANNELS.dapi.color;
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.ellipse(nucX, nucY, nucSize, nucSize * 0.9, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // DAPI dots
        ctx.globalAlpha = 0.7;
        this.dapiDots.forEach(dot => {
          const dotDist = dot.dist * nucSize;
          const dotX = nucX + Math.cos(dot.angle) * dotDist;
          const dotY = nucY + Math.sin(dot.angle) * dotDist * 0.9;
          ctx.fillStyle = `rgba(255, 255, 255, ${dot.brightness})`;
          ctx.shadowColor = CHANNELS.dapi.color;
          ctx.shadowBlur = 3;
          ctx.beginPath();
          ctx.arc(dotX, dotY, dot.size * nucSize, 0, Math.PI * 2);
          ctx.fill();
        });
        
        // Nucleoli
        ctx.globalAlpha = 0.95;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(nucX - nucSize * 0.12, nucY - nucSize * 0.08, nucSize * 0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.arc(nucX + nucSize * 0.18, nucY + nucSize * 0.12, nucSize * 0.1, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
      }
      
      checkClick(mx, my) {
        const sx = (this.x - panX) * zoom + width / 2;
        const sy = (this.y - panY) * zoom + height / 2;
        const ss = this.size * zoom;
        
        const dx = mx - sx;
        const dy = my - sy;
        return Math.sqrt(dx*dx + dy*dy) < ss;
      }
    }
    
    // Particle class
    class Particle {
      constructor() {
        this.reset();
      }
      
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = (Math.random() - 0.5) * 0.3;
        this.alpha = Math.random() * 0.5 + 0.1;
        this.color = ['#00f5ff', '#ff00ff', '#00ff88', '#8844ff'][Math.floor(Math.random() * 4)];
      }
      
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        
        if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
          this.reset();
        }
      }
      
      draw() {
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    // Create cells and particles
    const cells = samples.map(s => new Cell(s.x * 2 - 1, s.y * 2 - 1, 0.35, s.channels, s.type, s.id));
    const particles = Array.from({ length: 50 }, () => new Particle());
    
    // Reticle
    function drawReticle() {
      ctx.strokeStyle = 'rgba(0, 245, 255, 0.3)';
      ctx.lineWidth = 1;
      
      ctx.beginPath();
      ctx.moveTo(width/2 - 20, height/2);
      ctx.lineTo(width/2 + 20, height/2);
      ctx.moveTo(width/2, height/2 - 20);
      ctx.moveTo(width/2, height/2 + 20);
      ctx.stroke();
    }
    
    // Scale bar
    function drawScaleBar() {
      const scaleMicrons = 100 / zoom;
      const barWidth = scaleMicrons * zoom * 50;
      const barX = width - 32 - barWidth;
      const barY = height - 32;
      
      ctx.restore();
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(barX, barY, barWidth, 2);
      ctx.font = '10px JetBrains Mono';
      ctx.fillText(`${scaleMicrons}μm`, barX, barY - 10);
    }
    
    // Animation loop - only runs when page is visible
    let isPageVisible = true;
    document.addEventListener('visibilitychange', () => {
      isPageVisible = !document.hidden;
    });
    
    function animate() {
      if (!isPageVisible) {
        animationId = requestAnimationFrame(animate);
        return;
      }
      
      time += 0.016;
      
      // Clear
      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, width, height);
      
      // Draw particles
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      
      // Draw reticle
      drawReticle();
      
      // Draw cells
      cells.forEach(cell => {
        cell.update(time);
        cell.draw(time);
      });
      
      // Draw scale bar
      drawScaleBar();
      
      // Vignette
      const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.max(width, height) * 0.7);
      gradient.addColorStop(0, 'transparent');
      gradient.addColorStop(1, 'rgba(0,0,0,0.7)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
      
      animationId = requestAnimationFrame(animate);
    }
    animate();
    
    // Interactions
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY > 0 ? 0.95 : 1.05;
      zoom = Math.max(0.1, Math.min(60, zoom * zoomFactor));
      document.getElementById('zoomLevel').textContent = zoom.toFixed(1);
      
      if (!hasInteracted) {
        hasInteracted = true;
        document.getElementById('instructions').classList.add('hidden');
      }
    }, { passive: false });
    
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStart = { x: e.clientX, y: e.clientY };
      panStart = { x: panX, y: panY };
    });
    
    canvas.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const dx = (e.clientX - dragStart.x) / zoom;
        const dy = (e.clientY - dragStart.y) / zoom;
        panX = panStart.x - dx;
        panY = panStart.y - dy;
      }
    });
    
    canvas.addEventListener('mouseup', () => { isDragging = false; });
    canvas.addEventListener('mouseleave', () => { isDragging = false; });
    
    // Click to discover sample
    canvas.addEventListener('click', (e) => {
      if (isDragging) return;
      
      const mx = e.clientX;
      const my = e.clientY;
      
      for (const cell of cells) {
        if (cell.checkClick(mx, my) && !collectedSamples.has(cell.sampleId)) {
          collectedSamples.add(cell.sampleId);
          
          // Update orb
          const orb = document.getElementById(`orb-${cell.sampleId}`);
          if (orb) orb.classList.add('collected');
          
          // Update counter
          document.getElementById('collectedCount').textContent = collectedSamples.size;
          
          // Show info panel
          const sample = samples.find(s => s.id === cell.sampleId);
          if (sample) {
            document.getElementById('infoTitle').textContent = sample.name;
            document.getElementById('infoText').textContent = sample.description;
            document.getElementById('infoPanel').classList.add('visible');
          }
        }
      }
    });
    
    // Zoom buttons
    document.getElementById('zoomIn').addEventListener('click', () => {
      zoom = Math.min(60, zoom * 1.2);
      document.getElementById('zoomLevel').textContent = zoom.toFixed(1);
    });
    
    document.getElementById('zoomOut').addEventListener('click', () => {
      zoom = Math.max(0.1, zoom / 1.2);
      document.getElementById('zoomLevel').textContent = zoom.toFixed(1);
    });
    
    document.getElementById('resetView').addEventListener('click', () => {
      zoom = 0.5;
      panX = 0;
      panY = 0;
      document.getElementById('zoomLevel').textContent = zoom.toFixed(1);
    });
    
    // Close info panel
    document.getElementById('closePanel').addEventListener('click', () => {
      document.getElementById('infoPanel').classList.remove('visible');
    });
    
    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.getElementById('infoPanel').classList.remove('visible');
      }
    });
  </script>
</body>
</html>
